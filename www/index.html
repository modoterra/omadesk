<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desks · Omadesk</title>
    <meta
      name="description"
      content="Named-desk overlay for Omarchy. A desk is the current 1–10 workspaces, given a name."
    />
    <link rel="canonical" href="https://omadesk.mdtrr.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#121212" />
    <meta property="og:title" content="Desks · Omadesk" />
    <meta
      property="og:description"
      content="Named-desk overlay for Omarchy. A desk is the current 1–10 workspaces, given a name."
    />
    <meta property="og:url" content="https://omadesk.mdtrr.com/" />
    <meta property="og:image" content="https://omadesk.mdtrr.com/preview.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        var redirect = window.location.search;

        if (redirect.slice(0, 2) !== "?/") {
          return;
        }

        var decoded = redirect
          .slice(1)
          .split("&")
          .map(function (part) {
            return part.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          "",
          window.location.pathname.replace(/\/$/, "") + decoded + window.location.hash,
        );
      })();
    </script>
  </head>
  <body class="m-0 bg-desk-page font-mono text-desk-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
